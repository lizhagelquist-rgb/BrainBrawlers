<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Brain Brawlers</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,Arial;background:#130d2b;color:white}body{background:radial-gradient(circle at 50% 0,#443080,#130d2b 70%)}button{border:0;border-radius:14px;padding:12px 16px;margin:5px;background:#7952e9;color:white;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}h1{color:#ffd968}main{max-width:680px;margin:auto;padding:18px;text-align:center}section{display:none}section.active{display:block}.panel{background:#ffffff13;border:1px solid #ffffff36;border-radius:20px;padding:18px;margin:14px 0}.answers button{display:block;width:100%;margin:9px 0}.muted{color:#cfc5ef}.choice.selected{outline:3px solid #ffd968}#arena{position:fixed;inset:0;display:none;overflow:hidden;touch-action:none;background:#121a35}#arena.active{display:block}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:8px;font-size:clamp(12px,2.6vw,17px);font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none}#stick{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff77;touch-action:none}#nub{position:absolute;width:48px;height:48px;border-radius:50%;background:#a5a6ff;left:29px;top:29px;pointer-events:none}#fire{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;background:#ed536d;border:3px solid #ffb2c1;font-size:28px;touch-action:none}#overlay,#rotate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#110c29ed;text-align:center;padding:22px;z-index:4}#overlay.show{display:flex}@media(orientation:portrait) and (max-width:850px){#arena.active #rotate{display:flex}}@media(max-height:390px){#stick{width:88px;height:88px}#nub{left:20px;top:20px;width:42px;height:42px}#fire{width:72px;height:72px}}
</style></head><body>
<main id="pages"><section id="home" class="active"><h1>🎮 BRAIN BRAWLERS</h1><h2>⚡ HAGELQUIST-KLANEN ⚡</h2><p>Træn hjernen. Bliv stærkere. Undvig ildkugler!</p><div class="panel"><h2>Vælg din figur</h2><button class="choice selected" data-hero="shadow">⚡ Skyggekriger</button><button class="choice" data-hero="anime">🥋 Anime-helt</button></div><div class="panel"><h2>Vælg sværhedsgrad</h2><button data-level="Let">🟢 Let</button><button data-level="Mellem">🟡 Mellem</button><button data-level="Svær">🔴 Svær</button></div></section>
<section id="quiz"><h1>🧠 HJERNEKAMP</h1><p id="progress"></p><div class="panel"><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p></div><h2 id="points"></h2><button id="next" hidden>Næste spørgsmål ➡️</button></section>
<section id="result"><h1>🏆 Quiz gennemført!</h1><h2 id="resultPoints"></h2><p id="powerText"></p><button id="play">🔥 GÅ TIL ARENAEN!</button></section></main>
<div id="arena"><canvas id="canvas"></canvas><div id="hud"><span id="hp">❤️ 3</span><span id="clock">⏱️ 45</span><span id="stars">⭐ 0</span><span id="power">⚡ 1</span></div><div id="stick"><div id="nub"></div></div><button id="fire" aria-label="Angrib">⚡</button><div id="overlay"><h1 id="endTitle"></h1><h2 id="endScore"></h2><button id="restart">🔄 Spil igen</button></div><div id="rotate"><h1>📱 Vend telefonen</h1><p>Spillet er lavet til vandret skærm.</p></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const bank={
Let:[
['Skolefag','Hvad er 7 × 8?',['54','56','64'],1],['Skolefag','Hvad er 20 + 15?',['30','35','40'],1],['Skolefag','Hvilket ord er et navneord?',['Løbe','Glad','Hund'],2],
['Psykologi','Hvad kan hjælpe, når man er vred?',['Råbe højere','Trække vejret roligt','Slå i bordet'],1],['Psykologi','Hvad er empati?',['At forstå andres følelser','At være hurtigst','At vinde altid'],0],['Psykologi','Hvad er en følelse?',['En slags sko','Noget man oplever indeni','En planet'],1],
['Logik','Hvad kommer efter 2, 4, 6, 8?',['9','10','12'],1],['Logik','Hvad er anderledes?',['Æble','Pære','Cykel'],2],['Logik','Hvis alle katte er dyr, er en kat så et dyr?',['Ja','Nej','Kun om natten'],0],
['Paratviden','Hvilken planet bor vi på?',['Mars','Jorden','Venus'],1],['Paratviden','Hvor mange dage er der i en uge?',['5','7','9'],1],['Paratviden','Hvad er Danmarks hovedstad?',['Aarhus','Odense','København'],2]
],
Mellem:[
['Skolefag','Hvad er 3/4 af 100?',['25','50','75'],2],['Skolefag','Hvad er 12 × 9?',['108','98','118'],0],['Skolefag','Hvad er et udsagnsord?',['Et ord for en handling','Et stednavn','En farve'],0],
['Psykologi','Hvad betyder empati?',['At forstå andres følelser','At være enig med alle','At vinde diskussioner'],0],['Psykologi','Hvad kan stress gøre ved kroppen?',['Give uro og træthed','Gøre én usynlig','Fjerne søvnbehov'],0],['Psykologi','Hvad er en god måde at løse en konflikt på?',['Lytte og tale roligt','Afbryde hele tiden','Ignorere alle'],0],
['Logik','Hvad kommer efter 3, 6, 12, 24?',['36','48','50'],1],['Logik','En bus har 8 passagerer. 3 går af og 5 på. Hvor mange er der nu?',['8','10','13'],1],['Logik','Hvilket tal mangler: 1, 4, 9, 16, ...?',['20','25','30'],1],
['Paratviden','Hvad er Australiens hovedstad?',['Sydney','Melbourne','Canberra'],2],['Paratviden','Hvilket hav ligger mellem Europa og Amerika?',['Atlanterhavet','Stillehavet','Det Indiske Ocean'],0],['Paratviden','Hvor mange kontinenter regner man normalt med?',['5','6','7'],2]
],
Svær:[
['Skolefag','En vare koster 400 kr. og får 15 % rabat. Ny pris?',['340 kr.','350 kr.','360 kr.'],0],['Skolefag','Løs: 3x + 7 = 22. Hvad er x?',['3','5','7'],1],['Skolefag','Hvad er kvadratroden af 144?',['11','12','14'],1],
['Psykologi','“Jeg fejlede én gang, så jeg fejler altid.” Hvilken tankefælde?',['Overgeneralisering','God planlægning','Koncentration'],0],['Psykologi','Hvad betyder kognitiv dissonans?',['Modstrid mellem tanker og handlinger','At kunne læse tanker','At sove dybt'],0],['Psykologi','Hvad er en bekræftelsesbias?',['At søge oplysninger der støtter ens tro','At huske alt','At være helt upartisk'],0],
['Logik','Alle Zipper er Blopper. Alle Blopper er Ripper. Hvad må være sandt?',['Alle Ripper er Zipper','Alle Zipper er Ripper','Ingen Zipper er Ripper'],1],['Logik','Hvad er næste tal: 2, 3, 5, 8, 13, ...?',['18','20','21'],2],['Logik','To mønter giver 3 kr. Den ene er ikke en 1-krone. Hvilke mønter?',['2 kr. og 1 kr.','1 kr. og 1 kr.','2 kr. og 2 kr.'],0],
['Paratviden','Hvilket grundstof har symbolet W?',['Wolfram','Wismut','Watt'],0],['Paratviden','Hvem skrev romanen 1984?',['George Orwell','J.R.R. Tolkien','Jules Verne'],0],['Paratviden','Hvad kaldes læren om jordskælv?',['Seismologi','Meteorologi','Økologi'],0]
]};
let hero='shadow',level='Let',questions=[],qIndex=0,quizScore=0,answered=false;
document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{hero=b.dataset.hero;document.querySelectorAll('[data-hero]').forEach(x=>x.classList.toggle('selected',x===b));});
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.level));
function page(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active',s.id===id));}
function startQuiz(l){level=l;questions=bank[l];qIndex=0;quizScore=0;page('quiz');showQuestion();}
function showQuestion(){answered=false;const [cat,q,answers]=questions[qIndex];$('progress').textContent=`${cat} • Spørgsmål ${qIndex+1} af ${questions.length}`;$('question').textContent=q;$('points').textContent=`⭐ ${quizScore} point`;$('feedback').textContent='';$('next').hidden=true;$('answers').innerHTML='';answers.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i);$('answers').appendChild(b);});}
function answer(i){if(answered)return;answered=true;const correct=questions[qIndex][3],ok=i===correct;if(ok)quizScore+=10;$('feedback').textContent=ok?'✅ Rigtigt! +10 point':'❌ Ikke helt. Det rigtige svar er: '+questions[qIndex][2][correct];$('points').textContent=`⭐ ${quizScore} point`;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===correct)b.style.background='#21875e';else if(j===i)b.style.background='#a03c55';});$('next').hidden=false;$('next').textContent=qIndex===questions.length-1?'Se resultat 🏆':'Næste spørgsmål ➡️';}
$('next').onclick=()=>{qIndex++;if(qIndex<questions.length)showQuestion();else{page('result');$('resultPoints').textContent=`Du fik ${quizScore} af 120 point!`;$('powerText').textContent=`Din helt får ${1+Math.floor(quizScore/30)} i styrke og ekstra liv i arenaen.`;}};
// ---------- ARENA ----------
const canvas=$('canvas'),ctx=canvas.getContext('2d');let W=0,H=0,player,balls=[],gems=[],shots=[],running=false,last=0,elapsed=0,spawn=0,gemTimer=0,starScore=0,shotCooldown=0,animationId=0;const joy={x:0,y:0},keys={};
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=Math.max(25,Math.min(W-25,player.x));player.y=Math.max(40,Math.min(H-25,player.y));}}
window.addEventListener('resize',resize);
function rand(a,b){return a+Math.random()*(b-a)}
function startArena(){page('none');$('pages').style.display='none';$('arena').classList.add('active');$('overlay').classList.remove('show');resize();const power=1+Math.floor(quizScore/30);player={x:W/2,y:H/2,r:17,hp:3+Math.floor(quizScore/40),power,inv:0};balls=[];gems=[];shots=[];elapsed=0;spawn=0;gemTimer=0;starScore=0;shotCooldown=0;last=performance.now();running=true;for(let i=0;i<5;i++)addGem();cancelAnimationFrame(animationId);animationId=requestAnimationFrame(frame);}
$('play').onclick=startArena;
function addGem(){gems.push({x:rand(25,Math.max(26,W-25)),y:rand(45,Math.max(46,H-25)),r:9});}
function addBall(){const side=Math.floor(rand(0,4));let x=side===0?-20:side===1?W+20:rand(0,W);let y=side===2?-20:side===3?H+20:rand(0,H);balls.push({x,y,r:rand(12,19),speed:rand(45,70)+elapsed*1.5,phase:rand(0,6.28)});}
function shoot(){if(!running||shotCooldown>0)return;let target=null,best=Infinity;for(const b of balls){const d=Math.hypot(b.x-player.x,b.y-player.y);if(d<best){best=d;target=b;}}let dx=joy.x,dy=joy.y;if(target){dx=target.x-player.x;dy=target.y-player.y;}const len=Math.hypot(dx,dy)||1;shots.push({x:player.x,y:player.y,vx:dx/len*420,vy:dy/len*420,life:0.9,r:5+player.power});shotCooldown=Math.max(.25,.65-player.power*.06);}
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot();});
function frame(t){if(!running)return;const dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();animationId=requestAnimationFrame(frame);}
function update(dt){elapsed+=dt;spawn+=dt;gemTimer+=dt;shotCooldown=Math.max(0,shotCooldown-dt);player.inv=Math.max(0,player.inv-dt);const duration=45;if(elapsed>=duration){end(true);return;}if(spawn>Math.max(.55,2.2-elapsed*.027)){spawn=0;addBall();}if(gemTimer>3.5&&gems.length<10){gemTimer=0;addGem();}let dx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);const len=Math.hypot(dx,dy);if(len>0){player.x+=dx/Math.max(1,len)*205*dt;player.y+=dy/Math.max(1,len)*205*dt;}player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(34,Math.min(H-player.r,player.y));for(const b of balls){const x=player.x-b.x,y=player.y-b.y,d=Math.hypot(x,y)||1;b.x+=x/d*b.speed*dt;b.y+=y/d*b.speed*dt;b.phase+=dt*8;if(d<b.r+player.r&&player.inv<=0){player.hp--;player.inv=1.2;if(player.hp<=0){end(false);return;}}}for(let i=gems.length-1;i>=0;i--){const g=gems[i];if(Math.hypot(g.x-player.x,g.y-player.y)<g.r+player.r){gems.splice(i,1);starScore+=10;addGem();}}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let hit=false;for(let j=balls.length-1;j>=0;j--){if(Math.hypot(s.x-balls[j].x,s.y-balls[j].y)<s.r+balls[j].r){balls.splice(j,1);starScore+=5;hit=true;break;}}if(hit||s.life<=0)shots.splice(i,1);}$('hp').textContent=`❤️ ${player.hp}`;$('clock').textContent=`⏱️ ${Math.ceil(duration-elapsed)}`;$('stars').textContent=`⭐ ${starScore}`;$('power').textContent=`⚡ ${player.power}`;}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#14213e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(const g of gems){ctx.fillStyle='#ffdd53';ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?4:10;const x=g.x+Math.cos(a)*r,y=g.y+Math.sin(a)*r;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fill();}for(const b of balls){const grad=ctx.createRadialGradient(b.x-4,b.y-5,2,b.x,b.y,b.r*1.6);grad.addColorStop(0,'#fff6a0');grad.addColorStop(.35,'#ffab28');grad.addColorStop(.7,'#fa4d1f');grad.addColorStop(1,'#fa4d1f00');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff6b26';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.65,0,Math.PI*2);ctx.fill();}for(const s of shots){ctx.fillStyle='#a5faff';ctx.shadowColor='#79f1ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}if(player.inv===0||Math.floor(player.inv*10)%2===0){ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=22;ctx.shadowColor=hero==='shadow'?'#ad69ff':'#ffd35b';ctx.fillStyle=hero==='shadow'?'#713cba':'#e78b2f';ctx.beginPath();ctx.arc(0,0,player.r+4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=hero==='shadow'?'#251341':'#f4d6a3';ctx.beginPath();ctx.arc(0,-3,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=hero==='shadow'?'#d4b3ff':'#2c2336';ctx.beginPath();ctx.moveTo(-13,-10);ctx.lineTo(-7,-23);ctx.lineTo(0,-14);ctx.lineTo(8,-24);ctx.lineTo(13,-9);ctx.closePath();ctx.fill();ctx.fillStyle=hero==='shadow'?'#b9fbff':'#212139';ctx.fillRect(-8,-5,5,3);ctx.fillRect(4,-5,5,3);ctx.restore();}}
function end(won){running=false;$('endTitle').textContent=won?'🏆 Du overlevede!':'🔥 Ildkuglerne vandt!';$('endScore').textContent=`Quiz: ${quizScore} point • Arena: ${starScore} point`;$('overlay').classList.add('show');}
$('restart').onclick=()=>{location.reload();};
const stick=$('stick'),nub=$('nub');let activePointer=null;
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy;const m=Math.hypot(x,y),max=31;if(m>max){x=x/m*max;y=y/m*max;}joy.x=x/max;joy.y=y/max;nub.style.transform=`translate(${x}px,${y}px)`;}
stick.addEventListener('pointerdown',e=>{e.preventDefault();activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)moveStick(e);});function resetStick(e){if(e.pointerId!==activePointer)return;activePointer=null;joy.x=0;joy.y=0;nub.style.transform='translate(0,0)';}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' ')shoot();});window.addEventListener('keyup',e=>{keys[e.key]=false;});
</script></body></html>
